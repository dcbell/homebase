    AssetMaintenanceItemList:
      description: Asset maintenance items.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AssetMaintenanceItem"
    RelatedAssetList:
      description: Related assets.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RelatedAsset"
    Document:
      description: Document.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Document"
    DocumentList:
      description: Documents.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Document"
    RelatedDocumentList:
      description: Related documents.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RelatedDocument"
    RelatedItemList:
      description: Related items.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RelatedItem"

  schemas:
    Ok:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    Error:
      type: object
      properties:
        error:
          type: string
    Timestamp:
      type: string
      format: date-time
      example: "2026-06-13T12:00:00Z"
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: string }
        role: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Household:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ProjectInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { type: string, example: active }
        priority: { type: string, example: normal }
        due_date: { $ref: "#/components/schemas/Timestamp" }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
    ProjectFolderInput:
      type: object
      properties:
        title: { type: string }
        sort_order: { type: integer }
    ProjectFolder:
      allOf:
        - $ref: "#/components/schemas/ProjectFolderInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            project_id: { type: integer, format: int64 }
            status: { type: string }
    TaskInput:
      type: object
      properties:
        project_id: { type: integer, format: int64, nullable: true }
        project_folder_id: { type: integer, format: int64, nullable: true }
        routine_id: { type: integer, format: int64, nullable: true }
        asset_id: { type: integer, format: int64, nullable: true }
        asset_maintenance_item_id: { type: integer, format: int64, nullable: true }
        assigned_to: { type: integer, format: int64, nullable: true }
        title: { type: string }
        notes: { type: string }
        status: { type: string, example: open }
        priority: { type: string, example: normal }
        due_at: { $ref: "#/components/schemas/Timestamp" }
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            assigned_name: { type: string }
            completed_at: { $ref: "#/components/schemas/Timestamp" }
    EventInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at: { $ref: "#/components/schemas/Timestamp" }
        location: { type: string }
        attendee_ids:
          type: array
          items: { type: integer, format: int64 }
          description: >-
            Member ids of the Attendees, the Members the Appointment is for. Every id must be a
            Member of the Household (400 otherwise). Empty means the whole Household. On update,
            omitting the field keeps the current Attendees and an empty list clears them. Adding
            another Member sends them an Assignment Notification; adding yourself sends nothing.
        reminder_times:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ReminderTime" }
          description: >-
            When Attendees (or every Member, for a whole-household Appointment) are reminded.
            Appointments take only the timed form, before or at the start: minutes from -43200
            to 0, no repeats (400 otherwise). On create, omitting the field gives the defaults:
            24 hours before, an hour before and at the start. On update, omitting it keeps the
            current Reminder Times. An empty list means no Reminders. Changing them reschedules
            pending Reminders; any whose moment has passed are skipped.
          example: [{ minutes: -1440 }, { minutes: -60 }, { minutes: 0 }]
    ReminderTime:
      type: object
      description: >-
        A moment, relative to when something is due, at which a Reminder is sent. Timed form:
        minutes from the due time, negative before it, zero at it, positive after it. Date-only
        form: days from the due date at a local time of day. Before is Due Soon, at is Due Now,
        after is Overdue. Offsets are at most 30 days either way.
      properties:
        minutes: { type: integer, example: -60 }
        days: { type: integer, example: -1 }
        at: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", example: "08:00" }
    Attendee:
      type: object
      description: A Member an Appointment is for.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            status: { type: string, enum: [active, archived], example: active }
            attendees:
              type: array
              description: The Attendees ordered by name. Empty means the whole Household.
              items: { $ref: "#/components/schemas/Attendee" }
    RoutineInput:
      type: object
      properties:
        assigned_to: { type: integer, format: int64, nullable: true }
        title: { type: string }
        notes: { type: string }
        cadence: { type: string, example: monthly }
        status: { type: string, example: active }
        next_due_at: { $ref: "#/components/schemas/Timestamp" }
    Routine:
      allOf:
        - $ref: "#/components/schemas/RoutineInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            assigned_name: { type: string }
            last_completed_at: { $ref: "#/components/schemas/Timestamp" }
    HouseholdListInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        kind: { type: string }
        status: { type: string, example: active }
    HouseholdList:
      allOf:
        - $ref: "#/components/schemas/HouseholdListInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
    ListItemInput:
      type: object
      properties:
        assigned_to: { type: integer, format: int64, nullable: true }
        title: { type: string }
        notes: { type: string }
        status: { type: string, example: open }
        due_at: { $ref: "#/components/schemas/Timestamp" }
    ListItem:
      allOf:
        - $ref: "#/components/schemas/ListItemInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            list_id: { type: integer, format: int64 }
            assigned_name: { type: string }
            completed_at: { $ref: "#/components/schemas/Timestamp" }
    ContactInput:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }
        status: { type: string, example: active }
    Contact:
      allOf:
        - $ref: "#/components/schemas/ContactInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
    AssetInput:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        serial_number: { type: string }
        warranty_expires_at: { $ref: "#/components/schemas/Timestamp" }
        purchase_date: { $ref: "#/components/schemas/Timestamp" }
        purchase_cost: { type: number, format: double, nullable: true }
        vendor: { type: string }
        model: { type: string }
        maintenance_cadence: { type: string }
        maintenance_next_due_at: { $ref: "#/components/schemas/Timestamp" }
        notes: { type: string }
        status: { type: string, example: active }
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            maintenance_last_completed_at: { $ref: "#/components/schemas/Timestamp" }
    AssetMaintenanceInput:
      type: object
      properties:
        title: { type: string }
        notes: { type: string }
        cadence: { type: string, example: monthly }
        status: { type: string, example: active }
        next_due_at: { $ref: "#/components/schemas/Timestamp" }
    AssetMaintenanceItem:
      allOf:
        - $ref: "#/components/schemas/AssetMaintenanceInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
            asset_id: { type: integer, format: int64 }
            last_completed_at: { $ref: "#/components/schemas/Timestamp" }
    DocumentInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        url: { type: string }
        kind: { type: string }
        status: { type: string, example: active }
        file_name: { type: string }
        content_type: { type: string }
        file_size: { type: integer, format: int64 }
    DocumentUploadInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        url: { type: string }
        kind: { type: string }
        status: { type: string }
        file:
          type: string
          format: binary
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentInput"
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            household_id: { type: integer, format: int64 }
    RelatedItemInput:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [project, task, asset]
        entity_id:
          type: integer
          format: int64
    RelatedItem:
      type: object
      properties:
        link_id: { type: integer, format: int64 }
        type: { type: string }
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: string }
        url: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    RelatedDocument:
      type: object
      properties:
        link_id: { type: integer, format: int64 }
        document:
          $ref: "#/components/schemas/Document"
    RelatedContact:
      type: object
      properties:
        link_id: { type: integer, format: int64 }
        contact:
          $ref: "#/components/schemas/Contact"
    RelatedAsset:
      type: object
      properties:
        link_id: { type: integer, format: int64 }
        asset:
          $ref: "#/components/schemas/Asset"
    MemberInput:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, example: member }
    APIToken:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        household_id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string }
        scope:
          type: string
          enum: [read, write]
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    APITokenWithSecret:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          properties:
            token: { type: string }
    APITokenInput:
      type: object
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [read, write]
    CalendarConnection:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        household_id: { type: integer, format: int64 }
        name: { type: string, example: "David's iPhone" }
        kind:
          type: string
          enum: [ios, other]
        secret_prefix: { type: string, description: First characters of the secret. }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CalendarConnectionInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [ios, other]
          description: "`ios` sets up an iPhone or iPad with a setup profile; `other` is manual setup."
    CreatedCalendarConnection:
      type: object
      properties:
        connection: { $ref: "#/components/schemas/CalendarConnection" }
        server_url: { type: string, example: "https://homebase.example.com/caldav/" }
        username: { type: string, format: email, description: The Member's email. }
        secret: { type: string, description: Shown only in this response. }
    CreatedIPhoneCalendarConnection:
      type: object
      properties:
        connection: { $ref: "#/components/schemas/CalendarConnection" }
        profile_url:
          type: string
          example: "https://homebase.example.com/api/v1/calendar-profiles/abc123"
          description: Single-use setup profile link, valid for 10 minutes.
    ModuleItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        name: { type: string }
        kind: { type: string }
        cadence: { type: string }
        next_due_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    DashboardTile:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        household_id: { type: integer, format: int64 }
        recipient_id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [assignment, task_reminder, appointment_reminder]
        stage:
          type: string
          description: Reminder stage. Omitted for Assignment Notifications.
          enum: [due_soon, hour_before, due_now, overdue]
        subject_type:
          type: string
          enum: [task, list_item, routine, appointment]
        subject_id: { type: integer, format: int64 }
        url:
          type: string
          description: Web app path that opens the subject. List Items open their List.
          example: /tasks/42
        title: { type: string }
        body: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        read_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When the Member read it. Omitted while Unread.
    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count: { type: integer }
    PushSubscription:
      type: object
      description: >
        A device that receives Push. Every Notification is pushed with the
        payload {title, body, url, notification_id, unread_count}. Push
        Subscriptions their push service reports as gone are removed
        automatically.
      properties:
        id: { type: integer, format: int64 }
        household_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        name: { type: string, example: Safari on iPhone }
        endpoint: { type: string, format: uri }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When a Push was last accepted for it. Omitted until then.
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, description: Must be https. }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        name:
          type: string
          description: Optional display name. Defaults to one derived from the User-Agent.
    PushSettings:
      type: object
      description: >
        Whether each kind of Notification is sent to the Member's Push
        Subscriptions. Notifications of a kind that is off are still stored.
      required: [assignment, task_reminder, appointment_reminder]
      properties:
        assignment: { type: boolean, description: Assignment Notifications. }
        task_reminder: { type: boolean, description: Task Reminders. }
        appointment_reminder: { type: boolean, description: Appointment Reminders. }
    PushSettingsInput:
      type: object
      description: Kinds to change. Omitted kinds keep their current setting.
      properties:
        assignment: { type: boolean }
        task_reminder: { type: boolean }
        appointment_reminder: { type: boolean }
    Dashboard:
      type: object
      properties:
        household:
          $ref: "#/components/schemas/Household"
        current_user:
          $ref: "#/components/schemas/User"
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        routines:
          type: array
          items:
            $ref: "#/components/schemas/Routine"
        tile_order:
          type: array
          items:
            type: string
        available_tiles:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTile"
        budget_app_url:
          type: string
        notifications:
          allOf:
            - $ref: "#/components/schemas/NotificationList"
          description: The current Member's latest Notifications and Unread count, for the bell.
    CalendarEntry:
      type: object
      properties:
        type: { type: string }
        id: { type: integer, format: int64 }
        title: { type: string }
        url: { type: string }
        time: { $ref: "#/components/schemas/Timestamp" }
        meta: { type: string }
        status: { type: string }
        priority: { type: string }
        attendees:
          type: array
          description: Appointment entries only. Omitted when the Appointment is for the whole Household.
          items: { $ref: "#/components/schemas/Attendee" }
    CalendarDay:
      type: object
      properties:
        date: { $ref: "#/components/schemas/Timestamp" }
        in_month: { type: boolean }
        is_today: { type: boolean }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEntry"
    CalendarMonth:
      type: object
      properties:
        month: { $ref: "#/components/schemas/Timestamp" }
        prev_month: { type: string }
        next_month: { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
    AuditFields:
      type: object
      properties:
        created_by: { type: integer, format: int64 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

security:
  - sessionCookie: []
  - bearerToken: []
