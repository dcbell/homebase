openapi: 3.0.3
info:
  title: Homebase API
  version: 0.1.0
  description: >
    API for Homebase household operations. Most `/api/v1` routes require a valid
    `homebase_session` cookie created by the auth flow.
    API clients may also authenticate with an API token using
    `Authorization: Bearer <token>`. Read-only tokens may only call read
    endpoints.
servers:
  - url: /
tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Calendar Connections
    description: Phone and desktop calendar apps connected over CalDAV at /caldav/.
  - name: Notifications
  - name: Push
  - name: Members
  - name: Projects
  - name: Tasks
  - name: Events
  - name: Routines
  - name: Lists
  - name: Contacts
  - name: Assets
  - name: Documents
  - name: Modules
  - name: Integrations

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthz
      security: []
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /openapi.yaml:
    get:
      tags: [Health]
      summary: OpenAPI document
      operationId: openapiYaml
      security: []
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      tags: [Health]
      summary: OpenAPI document
      operationId: docsOpenapiYaml
      security: []
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /auth/oauth/start:
    get:
      tags: [Auth]
      summary: Start OAuth/OIDC login
      operationId: oauthStart
      security: []
      responses:
        "302":
          description: Redirects to the configured OAuth/OIDC provider.

  /auth/oauth/callback:
    get:
      tags: [Auth]
      summary: Complete OAuth/OIDC login
      operationId: oauthCallback
      security: []
      responses:
        "302":
          description: Sets the session cookie and redirects to the web app.
        "400":
          $ref: "#/components/responses/Error"



  /auth/dev-login:
    get:
      tags: [Auth]
      summary: Development login
      operationId: devLogin
      security: []
      responses:
        "302":
          description: Sets a development session cookie when enabled.
        "404":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Dashboard]
      summary: Current user and household
      operationId: getMe
      responses:
        "200":
          description: Current session context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  household:
                    $ref: "#/components/schemas/Household"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/api-tokens:
    get:
      tags: [Auth]
      summary: List API tokens
      operationId: listApiTokens
      description: Requires a browser session.
      responses:
        "200":
          description: API tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Auth]
      summary: Create API token
      operationId: createApiToken
      description: Requires a browser session. The plaintext token is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: Created API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenWithSecret"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/api-tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke API token
      operationId: revokeApiToken
      description: Requires a browser session.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/calendar-connections:
    get:
      tags: [Calendar Connections]
      summary: List my Calendar Connections
      operationId: listCalendarConnections
      description: Requires a browser session. Secrets are never returned.
      responses:
        "200":
          description: The current Member's Calendar Connections, active ones first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarConnection"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Calendar Connections]
      summary: Connect a calendar app
      operationId: createCalendarConnection
      description: |
        Requires a browser session. Creates a Calendar Connection for a CalDAV
        app. For kind `other` the response carries the server address,
        username and secret for manual setup; this is the only time the
        secret is available. For kind `ios` the response carries no secret,
        only `profile_url`: a single-use link, valid for 10 minutes, that
        downloads an iPhone setup profile holding the secret (see
        `GET /api/v1/calendar-profiles/{token}`). Devices log in to `/caldav/`
        with HTTP Basic auth (username and secret); `/.well-known/caldav`
        redirects there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarConnectionInput"
      responses:
        "201":
          description: Created Calendar Connection with its connection details (`other`) or its setup profile link (`ios`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreatedCalendarConnection"
                  - $ref: "#/components/schemas/CreatedIPhoneCalendarConnection"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/calendar-connections/{id}:
    delete:
      tags: [Calendar Connections]
      summary: Disconnect a calendar app
      operationId: revokeCalendarConnection
      description: Requires a browser session. The device stops syncing at once.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/calendar-profiles/{token}:
    get:
      tags: [Calendar Connections]
      summary: Download an iPhone setup profile
      operationId: downloadCalendarProfile
      security: []
      description: |
        Needs no session: the token from an `ios` connection's `profile_url`
        is the credential. Works once, within 10 minutes of creating the
        connection, while the connection is active. Downloading issues the
        connection's secret, which exists only inside the profile: an
        unsigned configuration profile with one CalDAV account (host, port
        and TLS from the public web base URL, the Member's email as username,
        the principal URL, description "Homebase").
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The setup profile, as an attachment named Homebase.mobileconfig.
          content:
            application/x-apple-aspen-config:
              schema:
                type: string
                format: binary
        "404":
          description: The link is unknown, expired, already used, or its connection was disconnected.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List my Notifications
      operationId: listNotifications
      description: >
        Lists the current Member's Notifications, newest first, with their
        Unread count. Listing marks nothing read. Read-only API tokens may call
        this.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_id
          in: query
          required: false
          description: Return Notifications older than this one, to fetch the next page.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: A page of Notifications and the Unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Notifications]
      summary: Mark a Notification read
      operationId: markNotificationRead
      description: >
        Requires a browser session or a full-access API token. Marking an
        already-read Notification keeps its original read time.
      responses:
        "200":
          description: The Notification, now read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my Notifications read
      operationId: markAllNotificationsRead
      description: Requires a browser session or a full-access API token.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/push/vapid-public-key:
    get:
      tags: [Push]
      summary: Get the VAPID public key
      operationId: getVapidPublicKey
      description: >
        The key a browser passes as applicationServerKey to
        pushManager.subscribe(). It is generated on the API's first start and
        stays the same until the database is replaced.
      responses:
        "200":
          description: The VAPID public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    description: Uncompressed P-256 public key, base64url without padding.
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/push-subscriptions:
    get:
      tags: [Push]
      summary: List my Push Subscriptions
      operationId: listPushSubscriptions
      description: The current Member's devices that receive Push, oldest first.
      responses:
        "200":
          description: Push Subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PushSubscription"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Push]
      summary: Register this device's Push Subscription
      operationId: registerPushSubscription
      description: >
        Requires a browser session. The body is the browser's
        PushSubscription.toJSON(). Registering an endpoint again updates it
        and returns 200 instead of 201, so it is safe to repeat. The display
        name defaults to one derived from the User-Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: The endpoint was already registered and has been updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "201":
          description: Registered Push Subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/push-subscriptions/{id}:
    delete:
      tags: [Push]
      summary: Remove a Push Subscription
      operationId: deletePushSubscription
      description: Requires a browser session or a full-access API token. The device stops receiving Push.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/push-settings:
    get:
      tags: [Push]
      summary: Get my Push settings
      operationId: getPushSettings
      description: >
        Which kinds of Notification the current Member gets as Push. Every
        kind is on until the Member turns it off.
      responses:
        "200":
          description: The current Member's Push settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSettings"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Push]
      summary: Update my Push settings
      operationId: updatePushSettings
      description: >
        Turns Push on or off per kind of Notification. Omitted kinds keep
        their current setting. Turning a kind off stops the Push only: those
        Notifications are still stored, appear in the bell and count towards
        Unread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSettingsInput"
      responses:
        "200":
          description: The updated Push settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSettings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/households/current:
    get:
      tags: [Dashboard]
      summary: Current household
      operationId: getCurrentHousehold
      responses:
        "200":
          description: Current household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard data
      operationId: getDashboard
      responses:
        "200":
          description: Household dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/calendar:
    get:
      tags: [Dashboard]
      summary: Calendar month
      operationId: getCalendar
      parameters:
        - name: month
          in: query
          description: Month to load in `YYYY-MM` format.
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Calendar month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarMonth"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/dashboard/tiles/move:
    post:
      tags: [Dashboard]
      summary: Move a dashboard tile
      operationId: moveDashboardTile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tile, direction]
              properties:
                tile:
                  type: string
                direction:
                  type: string
                  enum: [up, down]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/dashboard/tiles/order:
    post:
      tags: [Dashboard]
      summary: Replace dashboard tile order
      operationId: setDashboardTileOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiles]
              properties:
                tiles:
                  type: array
                  items:
                    type: string
                  example: [calendar, tasks, projects, appointments, list]
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/members:
    get:
      tags: [Members]
      summary: List household members
      operationId: listMembers
      responses:
        "200":
          $ref: "#/components/responses/UserList"
    post:
      tags: [Members]
      summary: Add a household member
      operationId: addMember
      requestBody:
        $ref: "#/components/requestBodies/MemberInput"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/members/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Members]
      summary: Update a household member
      operationId: updateMember
      requestBody:
        $ref: "#/components/requestBodies/MemberInput"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Members]
      summary: Remove a household member
      operationId: removeMember
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        $ref: "#/components/requestBodies/ProjectInput"
      responses:
        "201":
          $ref: "#/components/responses/Project"

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      requestBody:
        $ref: "#/components/requestBodies/ProjectInput"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Projects]
      summary: Archive a project
      operationId: archiveProject
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{id}/folders:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: List project folders
      operationId: listProjectFolders
      responses:
        "200":
          $ref: "#/components/responses/ProjectFolderList"
    post:
      tags: [Projects]
      summary: Create a project folder
      operationId: createProjectFolder
      requestBody:
        $ref: "#/components/requestBodies/ProjectFolderInput"
      responses:
        "201":
          $ref: "#/components/responses/ProjectFolder"

  /api/v1/project-folders/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Projects]
      summary: Update a project folder
      operationId: updateProjectFolder
      requestBody:
        $ref: "#/components/requestBodies/ProjectFolderInput"
      responses:
        "200":
          $ref: "#/components/responses/ProjectFolder"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/project-folders/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Projects]
      summary: Archive a project folder
      operationId: archiveProjectFolder
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      operationId: listTasks
      responses:
        "200":
          $ref: "#/components/responses/TaskList"
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        $ref: "#/components/requestBodies/TaskInput"
      responses:
        "201":
          $ref: "#/components/responses/Task"

  /api/v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      requestBody:
        $ref: "#/components/requestBodies/TaskInput"
      responses:
        "200":
          $ref: "#/components/responses/Task"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/tasks/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Tasks]
      summary: Complete a task
      operationId: completeTask
      responses:
        "200":
          $ref: "#/components/responses/Task"

  /api/v1/tasks/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Tasks]
      summary: Reopen a task
      operationId: reopenTask
      responses:
        "200":
          $ref: "#/components/responses/Task"

  /api/v1/tasks/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Tasks]
      summary: Archive a task
      operationId: archiveTask
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/events:
    get:
      tags: [Events]
      summary: List appointments/events
      operationId: listEvents
      responses:
        "200":
          $ref: "#/components/responses/EventList"
    post:
      tags: [Events]
      summary: Create an appointment/event
      operationId: createEvent
      requestBody:
        $ref: "#/components/requestBodies/EventInput"
      responses:
        "201":
          $ref: "#/components/responses/Event"

  /api/v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Events]
      summary: Get an appointment/event
      operationId: getEvent
      responses:
        "200":
          $ref: "#/components/responses/Event"
    patch:
      tags: [Events]
      summary: Update an appointment/event
      operationId: updateEvent
      requestBody:
        $ref: "#/components/requestBodies/EventInput"
      responses:
        "200":
          $ref: "#/components/responses/Event"
    delete:
      tags: [Events]
      summary: Archive an appointment
      description: Archives the Appointment and cancels its pending Reminders. Archived Appointments are left out of every list and the calendar, but can still be fetched by id.
      operationId: deleteEvent
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/routines:
    get:
      tags: [Routines]
      summary: List routines
      operationId: listRoutines
      responses:
        "200":
          $ref: "#/components/responses/RoutineList"
    post:
      tags: [Routines]
      summary: Create a routine
      operationId: createRoutine
      requestBody:
        $ref: "#/components/requestBodies/RoutineInput"
      responses:
        "201":
          $ref: "#/components/responses/Routine"

  /api/v1/routines/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Routines]
      summary: Get a routine
      operationId: getRoutine
      responses:
        "200":
          $ref: "#/components/responses/Routine"
    patch:
      tags: [Routines]
      summary: Update a routine
      operationId: updateRoutine
      requestBody:
        $ref: "#/components/requestBodies/RoutineInput"
      responses:
        "200":
          $ref: "#/components/responses/Routine"

  /api/v1/routines/{id}/archive:
