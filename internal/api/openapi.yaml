components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homebase_session
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EntityType:
      name: entity_type
      in: query
      required: true
      schema:
        type: string
        enum: [project, task, asset]
    EntityID:
      name: entity_id
      in: query
      required: true
      schema:
        type: integer
        format: int64

  requestBodies:
    MemberInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberInput"
    ProjectInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectInput"
    ProjectFolderInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectFolderInput"
    TaskInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskInput"
    EventInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventInput"
    RoutineInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoutineInput"
    HouseholdListInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HouseholdListInput"
    ListItemInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListItemInput"
    ContactInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactInput"
    AssetInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetInput"
    AssetMaintenanceInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetMaintenanceInput"
    RelatedItemInput:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RelatedItemInput"

  responses:
    Ok:
      description: Operation succeeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserList:
      description: Users.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/User"
    Project:
      description: Project.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProjectList:
      description: Projects.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Project"
    ProjectFolder:
      description: Project folder.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectFolder"
    ProjectFolderList:
      description: Project folders.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ProjectFolder"
    Task:
      description: Task.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Task"
    TaskList:
      description: Tasks.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Task"
    Event:
      description: Event.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    EventList:
      description: Events.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Event"
    Routine:
      description: Routine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Routine"
    RoutineList:
      description: Routines.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Routine"
    HouseholdList:
      description: Household list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HouseholdList"
    HouseholdListList:
      description: Household lists.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/HouseholdList"
    ListItem:
      description: List item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListItem"
    ListItemList:
      description: List items.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ListItem"
    Contact:
